<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Две лиги — АПЛ и КПЛ</title>
<meta name="description" content="Результаты, таблицы, аналитика, трансферы и фэнтези английской Премьер-лиги и чемпионата Казахстана.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee;--surf:#fff;--surf2:#efeae2;--ink:#17110f;--mute:#6b625c;--line:#ded7cd;
  --pri:#DA291C;--pri-ink:#fff;--acc:#F0B400;--acc-ink:#1a1400;--dark:#0e0c0b;--dark2:#1b1715;
  --win:#1f9d55;--draw:#8d857e;--loss:#DA291C;--board:#16120f;--board-ink:#f4efe6;
  --pitch1:#2f7d3e;--pitch2:#348a45;
  --f-head:'Unbounded','Arial Black',system-ui,sans-serif;--f-body:'Onest',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r:14px;
}
:root[data-lg="kpl"]{--pri:#0878A0;--acc:#F2B300;}
:root[data-theme="dark"]{
  --bg:#0f0d0c;--surf:#1a1614;--surf2:#241f1c;--ink:#f3eee7;--mute:#a79d94;--line:#332c28;
  --acc:#FBE122;--win:#3ecf7d;--draw:#9a928a;--loss:#ff5a4a;--board:#0a0807;--pitch1:#1f5a2b;--pitch2:#236631;
}
:root[data-theme="dark"][data-lg="kpl"]{--pri:#2aa9d6;--acc:#F2B300;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0d0c;--surf:#1a1614;--surf2:#241f1c;--ink:#f3eee7;--mute:#a79d94;--line:#332c28;
    --acc:#FBE122;--win:#3ecf7d;--draw:#9a928a;--loss:#ff5a4a;--board:#0a0807;--pitch1:#1f5a2b;--pitch2:#236631;
  }
  :root:not([data-theme="light"])[data-lg="kpl"]{--pri:#2aa9d6;--acc:#F2B300;}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header.top{background:var(--dark);color:#f4efe6;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--pri)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px}
.logo{font-family:var(--f-head);font-weight:800;font-size:17px;letter-spacing:.02em;text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap;background:none;border:0;color:inherit;padding:0}
.logo i{width:26px;height:26px;border-radius:50%;border:3px solid var(--acc);position:relative;display:inline-block}
.logo i::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:3px solid var(--acc)}
.logo b{color:var(--acc)}
nav.main{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main button{background:none;border:0;color:#cfc7bd;padding:8px 11px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
nav.main button:hover{color:#fff;background:#ffffff14}
nav.main button[aria-current="page"]{color:#fff;background:var(--pri)}
.iconbtn{background:#ffffff14;border:0;color:#fff;width:38px;height:38px;border-radius:50%;flex:none;font-size:17px}
.iconbtn:hover{background:#ffffff2a}
.demo{background:var(--acc);color:var(--acc-ink);text-align:center;font-size:13px;font-weight:600;padding:5px 12px}

/* common */
main{padding:22px 0 60px;min-height:70vh}
.sec{margin:34px 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(19px,3.2vw,26px)}
.sec-h h2::before{content:"";display:inline-block;width:10px;height:.9em;background:var(--pri);margin-right:10px;transform:skewX(-14deg);vertical-align:-.1em}
.more{background:none;border:0;color:var(--pri);font-weight:700;padding:4px 0}
.more:hover{text-decoration:underline}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surf2);color:var(--mute)}
.seg{display:inline-flex;background:var(--surf2);border-radius:99px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:7px 15px;border-radius:99px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.btn.ghost{background:var(--surf2);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--mute)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hero{background:var(--dark);color:#f4efe6;border-radius:22px;overflow:hidden;position:relative;padding:30px 26px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:repeating-linear-gradient(115deg,#DA291C 0 46px,#c32318 46px 92px)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#0e0c0bf2 0%,#0e0c0bd9 55%,#0e0c0b66 100%)}
.pitch-art{position:absolute;right:-60px;top:50%;width:420px;transform:translateY(-50%);opacity:.22;z-index:-1}
.hero h1{font-size:clamp(26px,5.2vw,46px);font-weight:800;max-width:14em}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p.lead{max-width:36em;color:#d8d0c6;margin:10px 0 22px}
.hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:6px}
@media(max-width:800px){.hero-grid{grid-template-columns:minmax(0,1fr)}.pitch-art{display:none}.hero{padding:22px 16px}}
.hbox{background:#ffffff12;border:1px solid #ffffff22;border-radius:14px;padding:14px;backdrop-filter:blur(3px)}
.hbox .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:700}
.hbox .big{font-family:var(--f-head);font-size:22px;margin-top:6px}
.cd{display:flex;gap:8px;margin-top:8px}
.cd div{background:var(--board);border-radius:8px;padding:6px 8px;text-align:center;min-width:52px}
.cd b{display:block;font-family:var(--f-head);font-size:20px;color:var(--board-ink)}
.cd span{font-size:11px;color:#a79d94}

/* match cards */
.match{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.match.mu{border-color:var(--pri);box-shadow:inset 4px 0 0 var(--pri)}
.m-top{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:8px;gap:8px}
.m-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.m-row .tm{font-weight:600;line-height:1.25}
.m-row .tm.r{text-align:right}
.board{background:var(--board);color:var(--board-ink);font-family:var(--f-head);font-weight:700;border-radius:9px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:20px;white-space:nowrap}
.board i{font-style:normal;color:#6f655d;font-size:14px}
.board.up{font-size:13px;font-family:var(--f-body);font-weight:600;color:#cfc7bd}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--mute)}
.ev .r{text-align:right}
.xg{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}

/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surf)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);background:var(--surf2)}
td.t,th.t{text-align:left}
tbody tr{border-bottom:1px solid var(--line)}
tbody tr:last-child{border:0}
tr.me td{background:color-mix(in srgb,var(--pri) 14%,transparent);font-weight:700}
td.pos{width:38px;border-left:4px solid transparent;font-weight:700}
td.z1{border-left-color:var(--win)}td.z2{border-left-color:var(--acc)}td.z3{border-left-color:var(--draw)}td.zr{border-left-color:var(--loss)}
.pts{font-family:var(--f-head);font-size:13px}
.form{display:inline-flex;gap:3px}
.fm{width:21px;height:21px;border-radius:5px;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.fm.В{background:var(--win)}.fm.Н{background:var(--draw)}.fm.П{background:var(--loss)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}

/* round nav */
.rnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rnav select{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rnav .btn{padding:8px 13px}

/* kpi */
.kpi b{font-family:var(--f-head);font-size:28px;display:block;color:var(--pri)}
.kpi span{color:var(--mute);font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink);font-family:var(--f-body);font-size:12px}
.chart .mu-t{fill:var(--mute)}
.ins li{margin:8px 0}
.ins b{color:var(--pri)}
.rank{list-style:none;margin:0;padding:0;counter-reset:r}
.rank li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border:0}
.rank li::before{counter-increment:r;content:counter(r);font-family:var(--f-head);width:24px;color:var(--pri);font-size:14px}
.rank .grow{flex:1;min-width:0}
.rank .grow small{display:block;color:var(--mute)}

/* transfers */
.trf{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.trow:hover{border-color:var(--pri)}
.trow[aria-pressed="true"]{border-color:var(--pri);box-shadow:inset 4px 0 0 var(--pri)}
.trow .nm{font-weight:700}
.trow .rt{font-size:13px;color:var(--mute)}
.fee{font-family:var(--f-head);font-size:16px;text-align:right}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.of{background:color-mix(in srgb,var(--win) 20%,transparent);color:var(--win)}
.st.dg{background:color-mix(in srgb,var(--acc) 30%,transparent);color:var(--ink)}
.st.sl{background:var(--surf2);color:var(--mute)}
.tdetail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.tdetail{grid-template-columns:minmax(0,1fr)}}
.ks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.ks div{background:var(--surf2);border-radius:10px;padding:8px 10px}
.ks b{display:block;font-family:var(--f-head);font-size:16px}
.ks span{font-size:12px;color:var(--mute)}
.up-t{color:var(--win)}.dn-t{color:var(--loss)}
.calc label{display:block;font-size:13px;font-weight:600;margin-top:12px}
.calc input[type=range]{width:100%;accent-color:var(--pri)}
.calc select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surf)}
.calc .out{background:var(--board);color:var(--board-ink);border-radius:12px;padding:14px;margin-top:16px}
.calc .out b{font-family:var(--f-head);font-size:26px;color:var(--acc);display:block}

/* fantasy */
.fgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
@media(max-width:900px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stats div{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--f-head);font-size:16px}
.stats span{font-size:11px;color:var(--mute)}
.pitch{background:repeating-linear-gradient(0deg,var(--pitch1) 0 48px,var(--pitch2) 48px 96px);border-radius:16px;padding:18px 6px;position:relative;border:3px solid #ffffff55}
.pitch::before{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:2px solid #ffffff55}
.prow{display:flex;justify-content:space-around;margin:14px 0;position:relative}
.slot{width:20%;min-width:62px;text-align:center;background:none;border:0;color:#fff;padding:0;position:relative}
.shirt{width:46px;height:46px;border-radius:50%;margin:0 auto 3px;display:grid;place-items:center;font-family:var(--f-head);font-size:12px;font-weight:700;border:2px dashed #ffffffaa;background:#00000022}
.slot.fill .shirt{background:var(--pri);border:2px solid #fff}
.slot .sn{font-size:11px;font-weight:700;line-height:1.1;background:#000000aa;border-radius:5px;padding:2px 3px;display:block}
.slot .sp{font-size:10px;opacity:.95}
.cap{position:absolute;top:-4px;right:6px;background:var(--acc);color:var(--acc-ink);width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;border:0;display:grid;place-items:center}
.cap.on{outline:2px solid #fff}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.flt input,.flt select{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.flt input{flex:1;min-width:130px}
.prow2{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow2 .pn small{display:block;color:var(--mute);font-size:12px}
.pill{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--surf2);margin-right:5px}
.scroll{max-height:560px;overflow-y:auto}
.add{width:32px;height:32px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:18px;line-height:1}
.add:disabled{background:var(--surf2);color:var(--mute);cursor:not-allowed}

/* social */
.soc{display:flex;gap:14px;align-items:center;text-decoration:none;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s}
.soc:hover{border-color:var(--pri);transform:translateY(-2px)}
.soc .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-head);font-weight:800;flex:none}
.soc b{display:block}
.soc span{color:var(--mute);font-size:14px}

footer{background:var(--dark);color:#cfc7bd;padding:30px 0;border-top:3px solid var(--pri)}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between}
footer a{color:#f4efe6;text-decoration:none;margin-right:14px;font-weight:600}
footer a:hover{color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="sr" href="#app">К содержимому</a>
<header class="top">
  <div class="wrap">
    <button class="logo" data-page="home" aria-label="Две лиги — на главную"><i></i>ДВЕ&nbsp;<b>ЛИГИ</b></button>
    <nav class="main" aria-label="Разделы" id="nav"></nav>
    <button class="iconbtn" id="themeBtn" aria-label="Переключить тему">◐</button>
  </div>
</header>
<div class="demo">Демо-данные: названия клубов настоящие, а матчи, игроки и суммы сгенерированы для прототипа</div>
<main><div class="wrap" id="app"></div></main>
<footer>
  <div class="wrap">
    <div><b style="font-family:var(--f-head)">ДВЕ ЛИГИ</b><br><span class="small">АПЛ и КПЛ · аналитика, трансферы, фэнтези.<br>Логотипы клубов не используются.</span></div>
    <div id="footSoc"></div>
  </div>
</footer>

<script>
/* ============ утилиты ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(2610);
const poisson=l=>{const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R()}while(p>L);return k-1};
const pick=a=>a[Math.floor(R()*a.length)];
const f1=n=>(Math.round(n*10)/10).toFixed(1).replace('.',',');
const f2=n=>n.toFixed(2).replace('.',',');
const pct=n=>Math.round(n*100)+'%';
const MU='Манчестер Юнайтед';
const fmtD=d=>d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});
const fmtT=d=>d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ============ данные ============ */
const LEAGUES={
 apl:{name:'АПЛ',full:'Английская Премьер-лига',rounds:38,played:8,zones:[[4,'z1','Лига чемпионов'],[5,'z2','Лига Европы'],[6,'z3','Лига конференций']],rel:3,
  teams:[['Арсенал','ARS',1.35],['Манчестер Сити','MCI',1.35],['Ливерпуль','LIV',1.3],['Манчестер Юнайтед','MUN',1.1],['Челси','CHE',1.2],['Тоттенхэм','TOT',1.1],['Ньюкасл','NEW',1.1],['Астон Вилла','AVL',1.05],['Брайтон','BHA',1.0],['Вест Хэм','WHU',.9],['Кристал Пэлас','CRY',1.0],['Брентфорд','BRE',.95],['Фулхэм','FUL',.95],['Эвертон','EVE',.85],['Борнмут','BOU',.95],['Вулверхэмптон','WOL',.75],['Ноттингем Форест','NFO',.9],['Лидс','LEE',.8],['Сандерленд','SUN',.75],['Бёрнли','BUR',.65]],
  surn:['Харпер','Коул','Бэнкс','Фостер','Уорд','Грин','Лоуренс','Ходж','Брукс','Дин','Мэйсон','Нэш','Прайс','Рид','Сойер','Таунсенд','Уэбб','Янг','Купер','Дойл','Эванс','Гиббс','Хьюз','Кларк','Мур','Пэйн','Роу','Стоун','Тернер','Уэллс','Барнс','Додд','Флинт','Хант','Лэнг','Нолан','Оуэн','Паркер','Шоу','Бейл'],
  ini:['Дж.','Т.','М.','Р.','Л.','Э.','Б.','Д.','К.','С.']},
 kpl:{name:'КПЛ',full:'Чемпионат Казахстана',rounds:26,played:8,zones:[[3,'z1','Еврокубки']],rel:2,

      });

    const n=teams.length,arr=teams.map((_,i)=>i),matches=[];
    for(let r=0;r<=PREL;r++){
      for(let i=0;i<n/2;i++){
        let a=arr[i],b=arr[n-1-i];
        if(i===0&&r%2===1)[a,b]=[b,a]; else if(i>0&&(r+i)%2===1)[a,b]=[b,a];

          const sh=m.h.s,sa=m.a.s,k=key==='kpl'?.88:1;
          const lh=1.3*k*Math.pow(sh/sa,.9),la=1.05*k*Math.pow(sa/sh,.9);

            return c.p;
          };
          for(let i=0;i<m.hg;i++){const p=scorer(m.h);p.g++;m.ev.push({s:'h',p:p.n,m:1+Math.floor(R()*90),pid:p.id})}

        }
        matches.push(m);
      }
      arr.splice(1,0,arr.pop());
    }
    /* очки фэнтези по турам */
    for(let r=1;r<=PREL;r++){
      teams.forEach(t=>{
        const ms=matches.find(m=>m.r===r&&(m.h===t||m.a===t));
        const conc=ms.h===t?ms.ag:ms.hg;
        t.pl.forEach(p=>{
          if(R()>.86){p.pts.push(0);return}
          const gl=ms.ev.filter(e=>e.pid===p.id).length;
          let v=2+gl*({GK:6,DEF:6,MID:5,FWD:4})[p.pos];

          if(R()<.1)v-=2;
          p.pts.push(Math.max(0,v));
        });
      });
    }
    teams.forEach(t=>t.pl.forEach(p=>{p.tot=p.pts.reduce((a,b)=>a+b,0);p.last=p.pts[PREL-1];p.form=p.pts.slice(-3).reduce((a,b)=>a+b,0)/3}));

  }
})();

    else{h.D++;a.D++;h.pts++;a.pts++;h.form.push('Н');a.form.push('Н')}
  });

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Голы и xG по командам">${body}

function chartRounds(lg){

const SLOTS={FWD:2,MID:4,DEF:4,GK:1},BUDGET=80;
const MINP=Object.fromEntries(POS.map(k=>[k,Math.min(...ALLP.filter(p=>p.pos===k).map(p=>p.price))]));
function fsel(){return S.fant.sel.map(id=>PID[id]).filter(Boolean)}

function fScore(sel,cap){return sel.reduce((s,p)=>s+p.tot*(p.id===cap?2:1),0)}
function buildSquad(noise,rand){
  const need={...SLOTS},res=[];let budget=BUDGET,left=11;
  const sorted=[...ALLP].map(p=>({p,s:(p.tot*(1+noise*(rand()-.5)))/Math.pow(p.price,.55)})).sort((a,b)=>b.s-a.s);
  for(const{p}of sorted){
    if(!need[p.pos])continue;
    need[p.pos]--;
    const reserve=POS.reduce((s,k)=>s+need[k]*MINP[k],0);
    need[p.pos]++;
    if(p.price>budget-reserve)continue;
    res.push(p);need[p.pos]--;budget-=p.price;left--;
    if(!left)break;
  }
  return res;
}

  const total=ps.length;ps=ps.slice(0,40);
  $('#fcat').innerHTML=ps.map(p=>{
    const inn=sel.includes(p.id),full=cnt(p.pos)>=SLOTS[p.pos],poor=p.price>BUDGET-spent-(10-sel.length)*4+0;
    const dis=inn||full||sel.length>=11||p.price>BUDGET-spent-Math.max(0,10-sel.length)*4;
    return `<div class="prow2"><div class="pn"><span class="pill">${POSSH[p.pos]}</span><b>${esc(p.n)}</b><small>${esc(p.tn)} · ${p.lg==='apl'?'АПЛ':'КПЛ'} · посл. тур ${p.last}</small></div><span class="num" title="Очки за сезон"><b>${p.tot}</b> <span class="muted small">очк.</span></span><span class="num">${p.price}</span><button class="add" data-act="add" data-id="${p.id}" ${dis?'disabled':''} aria-label="${inn?'Уже в составе':'Добавить '+esc(p.n)}">${inn?'✓':'+'}</button></div>`}).join('')+(total>40?`<p class="muted small">Показаны 40 из ${total}. Уточните поиск.</p>`:'')||'<p class="muted">Ничего не найдено.</p>';
}
function renderLB(){
  const lb=leaderboard();
  $('#lb').innerHTML=`<ol class="rank">${lb.map(m=>`<li${m.you?' style="background:color-mix(in srgb,var(--pri) 14%,transparent);border-radius:8px;padding-left:8px"':''}><div class="grow"><b>${esc(m.n)}</b></div><b class="num">${m.pts} очк.</b></li>`).join('')}</ol>${fsel().length<11?'<p class="muted small" style="margin:10px 0 0">Наберите 11 игроков, чтобы попасть в рейтинг.</p>':''}`;
}

function pageSocial(){
  return `<div class="sec-h"><h2>Соцсети</h2></div><p class="muted" style="max-width:40em">Подписывайтесь, чтобы не пропустить итоги туров, трансферы и обзоры матчей. Адреса — заглушки до запуска.</p>${socGrid()}`;
}

/* ============ рендер и события ============ */
let cdTimer;
function render(){
  clearInterval(cdTimer);
  const map={home:pageHome,matches:pageMatches,analytics:pageAnalytics,transfers:pageTransfers,fantasy:pageFantasy,social:pageSocial};
  $('#app').innerHTML=map[S.page]();
  document.documentElement.dataset.lg=(S.page==='matches'||S.page==='analytics')?S.lg:(S.page==='home'?'apl':document.documentElement.dataset.lg||'apl');
  if(S.page==='transfers'||S.page==='fantasy')document.documentElement.dataset.lg='apl';
  $('#nav').innerHTML=PAGES.map(([k,v])=>`<button data-page="${k}"${S.page===k?' aria-current="page"':''}>${v}</button>`).join('');
  if(S.page==='transfers')renderTransfers();
  if(S.page==='fantasy')renderFantasy();
  const cd=$('#cd');
  if(cd){const tick=()=>{let s=Math.floor((+cd.dataset.t-Date.now())/1000);if(s<0){cd.innerHTML='<span class="small" style="color:#cfc7bd">Матч демо-расписания уже прошёл</span>';return}
    const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;
    cd.innerHTML=[[d,'дн'],[h,'ч'],[m,'мин'],[c,'сек']].map(([v,l])=>`<div><b class="num">${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('')};
    tick();cdTimer=setInterval(tick,1000)}
}
function go(p){S.page=p;history.replaceState(null,'','#'+p);render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const pg=e.target.closest('[data-page]');
  if(pg){if(pg.dataset.setLg)S.lg=pg.dataset.setLg;go(pg.dataset.page);return}
  const tid=e.target.closest('[data-tid]');
  if(tid){if(S.page==='home'){S.tsel=+tid.dataset.tid;go('transfers')}else{S.tsel=+tid.dataset.tid;renderTransfers()}return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==='lg'){S.lg=a.dataset.v;render()}
  else if(act==='rprev'){S.rd[S.lg]=Math.max(1,S.rd[S.lg]-1);render()}
  else if(act==='rnext'){S.rd[S.lg]=Math.min(PREL+1,S.rd[S.lg]+1);render()}
  else if(act==='tf'){S.tf=a.dataset.v;render()}
  else if(act==='add'){const p=PID[id];if(p&&!S.fant.sel.includes(id)){S.fant.sel.push(id);if(!S.fant.cap)S.fant.cap=id;fSave();renderFantasy()}}
  else if(act==='rm'){S.fant.sel=S.fant.sel.filter(x=>x!==id);if(S.fant.cap===id)S.fant.cap=S.fant.sel[0]||null;fSave();renderFantasy()}
  else if(act==='cap'){S.fant.cap=id;fSave();renderFantasy()}
  else if(act==='auto'){const sq=buildSquad(0,()=>.5);S.fant.sel=sq.map(p=>p.id);S.fant.cap=[...sq].sort((a,b)=>b.tot-a.tot)[0].id;fSave();renderFantasy()}
  else if(act==='clear'){S.fant={sel:[],cap:null};fSave();renderFantasy()}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='rsel'){S.rd[S.lg]=+e.target.value;render()}
  else if(id==='fq'){S.fq=e.target.value;renderCat()}
  else if(id==='fpos'){S.fpos=e.target.value;renderCat()}
  else if(id==='flg'){S.flg=e.target.value;renderCat()}
  else if(id==='fsort'){S.fsort=e.target.value;renderCat()}
  else if(id&&id.startsWith('c-')){const k=id.slice(2);CS[k]=['from','to'].includes(k)?e.target.value:+e.target.value;calc()}
});
$('#themeBtn').addEventListener('click',()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';store.set('dl_theme',r.dataset.theme);
});
(function init(){
  const t=store.get('dl_theme');if(t)document.documentElement.dataset.theme=t;
  $('#footSoc').innerHTML=SOC.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener noreferrer">${s[0]}</a>`).join('');
  const h=location.hash.slice(1);if(PAGES.some(p=>p[0]===h))S.page=h;
  render();
})();
</script>
